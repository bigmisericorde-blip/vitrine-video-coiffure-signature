<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prise d’exemple — COIFFURE-T2</title><link rel="stylesheet" href="../../gabarits/coiffure-t2/assets/simulation-t2.css"><link rel="stylesheet" href="prise.css"><script type="module" src="prise.mjs"></script>
</head><body class="capture"><main id="app">
<video id="cam" playsinline muted preload="none" aria-label="Prise d’exemple filmée" hidden></video><video id="replay" playsinline muted preload="none" aria-label="Relecture de cette prise" hidden></video><div id="scrim" class="scrim off"></div>
<button id="clipPlayer" class="clip-player" type="button" hidden>Lire la prise</button>
<a class="return-gallery" href="ecrans.html" id="returnGallery" hidden>← Galerie</a>
<aside id="mediaFeedback" class="media-feedback" hidden><p id="mediaMessage" role="status">Chargement de l’exemple filmé…</p><button type="button" id="mediaRetry" hidden>Réessayer</button></aside>
<section class="sheet hidden" id="sheet" aria-label="Consigne de prise"><div class="grabber"></div><header class="sheet-head"><div class="head-row"><div class="scene-counter" id="sceneCounter"></div><div class="dots" id="dots"></div></div><div class="duration"><span id="durationLabel"></span></div><h1 class="scene-title" id="sceneTitle"></h1></header>
<div class="sheet-body" id="sheetBody"><p class="consigne" id="consigne"></p><p class="case-context" id="caseContext"></p><div class="block film"><h2 class="block-title"><span aria-hidden="true">✓</span> À filmer</h2><ul id="listFilm"></ul></div><div class="block avoid"><h2 class="block-title"><span aria-hidden="true">✕</span> À éviter</h2><ul id="listAvoid"></ul></div><div class="voice"><div><p class="voice-title">Le son</p><p id="soundText"></p></div></div><p class="consigne" id="captureConsent"></p></div>
<div class="sheet-foot"><button type="button" class="scroll-hint" id="scrollHint" aria-controls="sheetBody" hidden>Lire la suite ↓</button><button id="cta" type="button" class="cta">VOIR L’EXEMPLE FILMÉ</button></div></section>
<div class="rec" id="rec" aria-hidden="true"><div class="chrono" id="chrono" aria-label="Chronomètre simulé"><span class="dot"></span><span id="chronoVal">0:00</span></div><p class="rec-hint" id="recordLabel">Extrait filmé · chrono simulé</p><div class="bar" id="bar"><i id="barFill"></i></div></div>
<div class="review" id="review"><div class="lbl"><span class="prise" id="reviewLabel"></span><span>PRISE D’EXEMPLE</span></div><div class="sound">Extrait sans son · aucune prise validée</div><p id="reviewQuestion" class="review-question"></p><div class="btns"><button class="btn" type="button" id="redo">REFAIRE</button><button class="btn primary" type="button" id="next">VALIDER ET CONTINUER</button></div></div>
</main></body></html>
